<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EnergyCore high fidelity mockups</title><desc id="desc">High fidelity mockups of landing, web dashboard and Flutter dashboard in the EnergyCore visual system.</desc>
