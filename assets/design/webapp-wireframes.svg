  <defs><style>.bg{fill:#f6f7f6}.frame{fill:#fff;stroke:#7f8983;stroke-width:2}.dark{fill:#25312a}.line{stroke:#aab1ad;stroke-width:2}.accent{fill:#d9fbe6;stroke:#1b7f46;stroke-width:2}.t{font:700 18px Arial,sans-serif;fill:#25312a}.s{font:500 13px Arial,sans-serif;fill:#66706a}.cap{font:700 15px Arial,sans-serif;fill:#25312a;letter-spacing:2px}</style></defs>
