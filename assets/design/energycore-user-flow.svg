<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">EnergyCore end to end user flow</title><desc id="desc">Flow from landing page to login, onboarding, monitoring, action and learning.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0l10 5-10 5z" fill="#36d879"/></marker><style>.bg{fill:#07110b}.node{fill:#111d15;stroke:#285f3b;stroke-width:2}.active{fill:#133b22;stroke:#36d879;stroke-width:3}.warn{fill:#2a2110;stroke:#f5b73b;stroke-width:2}.line{fill:none;stroke:#36d879;stroke-width:4;marker-end:url(#arrow)}.dash{fill:none;stroke:#50705b;stroke-width:3;stroke-dasharray:9 9;marker-end:url(#arrow)}.title{font:800 34px Arial,sans-serif;fill:#f3fff7}.cap{font:700 15px Arial,sans-serif;fill:#51e48d;letter-spacing:2px}.t{font:700 20px Arial,sans-serif;fill:#f3fff7}.s{font:500 14px Arial,sans-serif;fill:#a9b7ad}</style></defs>
  <rect class="bg" width="1600" height="900"/><text x="70" y="63" class="cap">PROTOTIPO DE FLUJO / ENERGYCORE</text><text x="70" y="112" class="title">De una señal invisible a una decisión verificable</text>
  <path d="M284 252H430" class="line"/><path d="M680 252H826" class="line"/><path d="M1076 252H1222" class="line"/>
  <g transform="translate(70 178)"><rect width="214" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">01 DESCUBRIR</text><text x="24" y="79" class="t">Landing Page</text><text x="24" y="108" class="s">Valor · planes · CTA</text></g>
  <g transform="translate(430 178)"><rect width="250" height="148" rx="22" class="active"/><text x="24" y="39" class="cap">02 ACCEDER</text><text x="24" y="79" class="t">Login seguro</text><text x="24" y="108" class="s">JWT · recuperación · idioma</text></g>
  <g transform="translate(826 178)"><rect width="250" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">03 CONFIGURAR</text><text x="24" y="79" class="t">Espacio y equipos</text><text x="24" y="108" class="s">Sede · habitación · asignación</text></g>
  <g transform="translate(1222 178)"><rect width="308" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">04 ENTENDER</text><text x="24" y="79" class="t">Dashboard energético</text><text x="24" y="108" class="s">Potencia · costo · tendencia · pico</text></g>
  <path d="M1376 326V455" class="line"/><path d="M1222 529H1076" class="line"/><path d="M826 529H680" class="line"/><path d="M430 529H284" class="line"/>
  <g transform="translate(1222 455)"><rect width="308" height="148" rx="22" class="active"/><text x="24" y="39" class="cap">05 DECIDIR</text><text x="24" y="79" class="t">Recomendación</text><text x="24" y="108" class="s">Contexto y prioridad accionable</text></g>
  <g transform="translate(826 455)"><rect width="250" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">06 ACTUAR</text><text x="24" y="79" class="t">Control y rutinas</text><text x="24" y="108" class="s">Dispositivo · grupo · modo</text></g>
  <g transform="translate(430 455)"><rect width="250" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">07 VERIFICAR</text><text x="24" y="79" class="t">Alertas y metas</text><text x="24" y="108" class="s">Estado · progreso · reintento</text></g>
  <g transform="translate(70 455)"><rect width="214" height="148" rx="22" class="node"/><text x="24" y="39" class="cap">08 APRENDER</text><text x="24" y="79" class="t">Historial</text><text x="24" y="108" class="s">Reporte · exportación</text></g>
  <path d="M177 603V710H1376V603" class="dash"/>
  <rect x="418" y="680" width="764" height="118" rx="24" class="warn"/><text x="455" y="724" class="t">Condiciones transversales</text><text x="455" y="757" class="s">Tema del sistema · ES/EN/PT · responsive · error recuperable · consentimiento · trazabilidad API</text>
  <text x="70" y="850" class="s">El prototipo navegable se materializa en la Landing Page, Angular y Flutter; este mapa conserva el recorrido común entre clientes y backend.</text>
