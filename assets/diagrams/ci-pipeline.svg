<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="DESCRIPTION" style="width:671px;height:909px;background:#FFFFFF;" width="671px" height="909px" viewBox="0 0 671 909" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.9?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="1"><text x="231.275" y="22.674" fill="#000" font-size="14" textLength="201.455" font-weight="700" font-family="Arial">CI configurada por repositorio</text></g><!--entity Trigger--><g class="entity" data-qualified-name="Trigger" id="ent0001" data-source-line="20"><rect x="57.5" y="43.641" width="264.357" height="51.281" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="6" ry="6"/><text x="67.5" y="66.314" fill="#111827" font-size="14" textLength="244.357" font-family="Arial">push / pull_request / workflow_dispatch</text><text x="67.5" y="81.955" fill="#111827" font-size="14" textLength="203.902" font-family="Arial">en el repositorio correspondiente</text></g><!--entity Setup--><g class="entity" data-qualified-name="Setup" id="ent0002" data-source-line="21"><rect x="27.5" y="155.641" width="323.502" height="66.922" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="6" ry="6"/><text x="37.5" y="178.314" fill="#111827" font-size="14" textLength="166.551" font-family="Arial">Checkout y entorno del job</text><text x="37.5" y="193.955" fill="#111827" font-size="14" textLength="303.502" font-family="Arial">Java, Node, Flutter o Python según el repositorio</text><text x="37.5" y="209.596" fill="#111827" font-size="14" textLength="198.44" font-family="Arial">Permiso general: contents: read</text></g><!--entity Verify--><g class="entity" data-qualified-name="Verify" id="ent0003" data-source-line="22"><rect x="7" y="283.641" width="364.723" height="238.969" fill="#F0FDF4" style="stroke:#15803D;stroke-width:0.5;" rx="6" ry="6"/><text x="17" y="306.314" fill="#111827" font-size="14" textLength="206.903" font-family="Arial">VERIFICACIÓN CONFIGURADA</text><text x="17" y="321.955" fill="#111827" font-size="14" font-family="Arial"> </text><text x="17" y="337.596" fill="#111827" font-size="14" textLength="197.62" font-family="Arial">Platform (Ubuntu): Maven verify</text><text x="17" y="353.236" fill="#111827" font-size="14" textLength="238.096" font-family="Arial">JUnit, integración y BDD; Docker build</text><text x="17" y="368.877" fill="#111827" font-size="14" font-family="Arial"> </text><text x="17" y="384.518" fill="#111827" font-size="14" textLength="301.916" font-family="Arial">WebApp (Ubuntu): npm ci, test:ci y build Angular</text><text x="17" y="400.158" fill="#111827" font-size="14" textLength="226.413" font-family="Arial">Website (Ubuntu): npm ci y npm test</text><text x="17" y="415.799" fill="#111827" font-size="14" font-family="Arial"> </text><text x="17" y="431.439" fill="#111827" font-size="14" textLength="312.026" font-family="Arial">Mobile (Ubuntu): formato, analyze, test --coverage</text><text x="17" y="447.08" fill="#111827" font-size="14" textLength="122.179" font-family="Arial">y build APK release</text><text x="17" y="462.721" fill="#111827" font-size="14" textLength="344.723" font-family="Arial">Mobile (macOS, job independiente): build iOS simulator</text><text x="17" y="478.361" fill="#111827" font-size="14" font-family="Arial"> </text><text x="17" y="494.002" fill="#111827" font-size="14" textLength="343.178" font-family="Arial">Report (Ubuntu): validadores del informe, alcance AV2,</text><text x="17" y="509.643" fill="#111827" font-size="14" textLength="275.475" font-family="Arial">presentación, artefactos y reglas del monitor</text></g><!--entity Artifacts--><g class="entity" data-qualified-name="Artifacts" id="ent0004" data-source-line="23"><rect x="21.5" y="615.641" width="335.943" height="160.766" fill="#DCFCE7" style="stroke:#15803D;stroke-width:0.5;" rx="6" ry="6"/><text x="31.5" y="638.314" fill="#111827" font-size="14" textLength="156.358" font-family="Arial">ARTEFACTOS DEL JOB</text><text x="31.5" y="653.955" fill="#111827" font-size="14" font-family="Arial"> </text><text x="31.5" y="669.596" fill="#111827" font-size="14" textLength="226.434" font-family="Arial">Platform: JAR y reportes de pruebas</text><text x="31.5" y="685.236" fill="#111827" font-size="14" textLength="175.103" font-family="Arial">WebApp: dist de producción</text><text x="31.5" y="700.877" fill="#111827" font-size="14" textLength="261.406" font-family="Arial">Website: HTML, CSS, JavaScript y assets</text><text x="31.5" y="716.518" fill="#111827" font-size="14" textLength="315.943" font-family="Arial">Mobile: APK, cobertura y Runner.app de simulador</text><text x="31.5" y="732.158" fill="#111827" font-size="14" textLength="234.227" font-family="Arial">Report: informe y archivos de entrega</text><text x="31.5" y="747.799" fill="#111827" font-size="14" font-family="Arial"> </text><text x="31.5" y="763.439" fill="#111827" font-size="14" textLength="247.447" font-family="Arial">Identificación mediante SHA del commit</text></g><g class="entity" data-qualified-name="GMN8" id="ent0009" data-source-line="30"><path d="M407,349.641 L407,399.141 L372.19,403.141 L407,407.141 L407,457.125 A6,6 0 0 0 413,463.125 L650.006,463.125 A6,6 0 0 0 656.006,457.125 L656.006,353.641 L646.006,343.641 L413,343.641 A6,6 0 0 0 407,349.641" style="stroke:#94A3B8;stroke-width:0.5;" fill="#F8FAFC"/><path d="M646.006,343.641 L646.006,350.641 A3,3 0 0 0 649.006,353.641 L656.006,353.641 L646.006,343.641" style="stroke:#94A3B8;stroke-width:0.5;" fill="#F8FAFC"/><text x="413" y="361.314" fill="#334155" font-size="14" textLength="193.006" font-family="Arial">Son workflows independientes.</text><text x="413" y="376.955" fill="#334155" font-size="14" textLength="228.006" font-family="Arial">No se ejecutan los cinco repositorios</text><text x="413" y="392.596" fill="#334155" font-size="14" textLength="147.096" font-family="Arial">como un único pipeline.</text><text x="413" y="408.236" fill="#334155" font-size="14" font-family="Arial"> </text><text x="413" y="423.877" fill="#334155" font-size="14" textLength="210.096" font-family="Arial">Un fallo marca el job como fallido.</text><text x="413" y="439.518" fill="#334155" font-size="14" textLength="213.206" font-family="Arial">Platform conserva sus reportes de</text><text x="413" y="455.158" fill="#334155" font-size="14" textLength="182.123" font-family="Arial">pruebas incluso ante un fallo.</text></g><g class="entity" data-qualified-name="GMN11" id="ent0012" data-source-line="40"><path d="M22,843.641 L22,888.563 A6,6 0 0 0 28,894.563 L351.405,894.563 A6,6 0 0 0 357.405,888.563 L357.405,847.641 L347.405,837.641 L193.5,837.641 L189.5,776.711 L185.5,837.641 L28,837.641 A6,6 0 0 0 22,843.641" style="stroke:#94A3B8;stroke-width:0.5;" fill="#F8FAFC"/><path d="M347.405,837.641 L347.405,844.641 A3,3 0 0 0 350.405,847.641 L357.405,847.641 L347.405,837.641" style="stroke:#94A3B8;stroke-width:0.5;" fill="#F8FAFC"/><text x="28" y="855.314" fill="#334155" font-size="14" textLength="312.108" font-family="Arial">La configuración no acredita una ejecución nueva.</text><text x="28" y="870.955" fill="#334155" font-size="14" textLength="314.405" font-family="Arial">El build de simulador iOS no publica en App Store.</text><text x="28" y="886.596" fill="#334155" font-size="14" textLength="308.219" font-family="Arial">El despliegue es un job separado y condicionado.</text></g><!--link Trigger to Setup--><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk5" data-source-line="25" data-link-type="dependency"><path d="M189.5,94.881 C189.5,112.451 189.5,131.221 189.5,150.371" style="stroke:#15803D;stroke-width:1;" fill="none" id="Trigger-to-Setup"/><polygon points="189.5,155.371,193.5,146.371,189.5,150.371,185.5,146.371,189.5,155.371" fill="#15803D" style="stroke:#15803D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Setup to Verify--><g class="link" data-entity-1="ent0002" data-entity-2="ent0003" id="lnk6" data-source-line="26" data-link-type="dependency"><path d="M189.5,222.801 C189.5,239.531 189.5,256.031 189.5,278.301" style="stroke:#15803D;stroke-width:1;" fill="none" id="Setup-to-Verify"/><polygon points="189.5,283.301,193.5,274.301,189.5,278.301,185.5,274.301,189.5,283.301" fill="#15803D" style="stroke:#15803D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/></g><!--link Verify to Artifacts--><g class="link" data-entity-1="ent0003" data-entity-2="ent0004" id="lnk7" data-source-line="27" data-link-type="dependency"><path d="M189.5,522.921 C189.5,554.041 189.5,581.841 189.5,610.381" style="stroke:#15803D;stroke-width:1;" fill="none" id="Verify-to-Artifacts"/><polygon points="189.5,615.381,193.5,606.381,189.5,610.381,185.5,606.381,189.5,615.381" fill="#15803D" style="stroke:#15803D;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><text x="191.676" y="566.314" fill="#000" font-size="14" textLength="208.571" font-family="Arial">pasos de compilación/publicación</text><text x="190.5" y="581.955" fill="#000" font-size="14" textLength="210.923" font-family="Arial">condicionados al resultado del job</text></g><?plantuml-src TLNBRkD64BphAnhhIm9elIi_i8u21A0bAol7BqYsSn6m60rRrAo7CymyP6Y3V4K-9RTS_MEf8IcRTfABPR9dggkhkfj11SqqcfAqPgMAw4GkgBAE75VMgs2TihrWAmgMbZO4MrAk7CkWhEdv1sKguKH9Io4V2cUZoKTMu_RZMWNknFrQvFPHcO9MGljk9EULY3fCh0bNecJAd1Bwl-DpzOrfSDG9PixPnoRZtk3uvEFXk1EiwKZh33iQ77G3e2zCWRf_xn6Tlg6-D_au6K-EKiIwdDrhUAB4PFTkC3Wv-DJxeuDjRFW_s9D9DXczXVtXA3iyFNaDUtXuD3W-1cplXUcxAlerVQ0gQlt5yM-HVS3ZetKFAsqVl-JALoB8zSAm8TPT-s2jS-mhQtB59l0x4fvkdIeATjqCepNB1ni3RGd7e9k5-9g-skN2d8kDwDELpRbF4nr3WAQMRhPXRGrvBfx-VfjrOMxObSfRAXWE23rCBHQ0x8Su9_AQnfn3hBeaxizcqybqb8scJtzUqUZwQZBz-MwMZRE50Q8MOMLTIT_TBQC9yViXNOeD2jwmKwijQDuP5VgaaATmGggdlmogEHsFVwInbGyWlOnAvmdhLrvcLTL1CbL9KlKfGDcXLBXNdwNC554BLzz0RVolApYP_adt4l2bNIhTFPKOYs3x98pGss_SfA3txwK5Rr7mmZpdkla5scWMdb-0IY6lv_ta0mhBkUBMHq0t